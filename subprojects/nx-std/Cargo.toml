[package]
name = "nx-std"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_std"
crate-type = ["rlib", "staticlib"]
test = false
doctest = false
bench = false

[features]
# All non-sys features are enabled by default
default = ["alloc", "rand", "sync", "time"]

# Low-level features
sys = ["svc", "sys-fd", "sys-mem", "sys-net", "sys-sync", "sys-thread", "sys-thread-tls"]

# FFI overrides for libnx functions (only if the dependency is enabled)
ffi = [
    "nx-alloc?/ffi",
    "nx-net?/ffi",
    "nx-tls?/ffi",
    "nx-fsdev?/ffi",
    "nx-pm?/ffi",
    "nx-rand?/ffi",
    # The `getrandom` backend symbol is `#[no_mangle]` like the C surface, so the archive that
    # carries one carries the other: one definition per program, a link error if that slips.
    "nx-rand?/getrandom-backend",
    "nx-romfs?/ffi",
    "nx-rt-core?/ffi",
    "nx-rt-hbapp?/ffi",
    "nx-rt-nso?/ffi",
    "nx-service-sm?/ffi",
    "nx-sf?/ffi",
    "nx-std-sync?/ffi",
    "nx-svc?/ffi",
    "nx-sys-env?/ffi",
    "nx-sys-fd?/ffi",
    "nx-sys-mem?/ffi",
    "nx-sys-net?/ffi",
    "nx-sys-sync?/ffi",
    "nx-sys-thread?/ffi",
    "nx-sys-thread-tls?/ffi",
    "nx-sys-virtmem?/ffi",
    "nx-time?/ffi",
    "nx-wlaninf?/ffi",
]

# High-level features
services = ["service-apm", "service-applet", "service-fs", "service-hid", "service-nv", "service-sm", "service-set", "service-sfdnsres", "service-time", "service-vi"]

# Borrow the process-wide state of the crates below instead of defining it. An application library
# linked alongside the umbrella turns this on and leaves `ffi` off; exactly one static library in a
# program does the reverse. See docs/code/rust-process-wide-state.md.
# Every direct dependency here that holds process-wide state carries the feature; one reached only
# through another crate is forwarded by that crate, as `nx-sys-net` forwards to `nx-service-bsd`.
extern-state = [
    "nx-sys-args?/extern-state",
    "nx-sys-fd?/extern-state",
    "nx-sys-net?/extern-state",
]

# Dependency features
alloc = ["dep:nx-alloc", "nx-alloc/global-allocator"]
display = ["dep:nx-display", "service-vi"]
# The process environment in `std::env` shape, over the command-line store.
env = ["dep:nx-sys-args", "dep:nx-sys-env", "dep:nx-std-path", "dep:thiserror", "alloc"]
# Forwards to `nx-rt-core`, which owns the five resolver symbols that reach
# `sfdnsres` over the service-manager session it holds.
net = ["dep:nx-net", "nx-rt-core?/net"]
# TLS socket hand-offs. Gates the `socketSslConnection*` overrides; the crate
# sits above the runtime, so it resolves the firmware its DTLS gate needs itself.
tls = ["dep:nx-tls"]
# Files and directories addressed by path: the `std::fs` surface over the descriptor table.
fs = ["sys-fd", "dep:nx-std-path", "dep:thiserror", "alloc"]
# The filesystem device, replacing libnx's fsdev devoptab layer.
fsdev = ["dep:nx-fsdev", "sys-fd", "service-fs"]
pm = ["dep:nx-pm"]
rand = ["dep:nx-rand"]
# The read-only filesystem device, replacing libnx's romfs devoptab layer. Pulls
# `fsdev`: the image's bytes are read through a mounted device, and the fsp-srv
# session both reach for lives in that crate. Forwards to whichever entry crate
# is in the link, which owns the one entry point that depends on the output kind.
romfs = ["dep:nx-romfs", "fsdev", "nx-rt-hbapp?/romfs", "nx-rt-nso?/romfs"]
rt = ["dep:nx-rt-core"]
# The entry crate for the homebrew loader handoff; mutually exclusive with `rt-nso`.
rt-hbapp = ["dep:nx-rt-hbapp", "rt"]
# Per-kind `.crt0` for the opt-in `rustc`-link pipeline. Forwards to whichever
# entry crate is in the link, because the `_start` it emits only reaches the
# binary through this crate: the entry crates build as rlibs, and a feature set
# on their own cargo invocation does not travel to the staticlib linked here.
rt-link = ["nx-rt-hbapp?/rt-link", "nx-rt-nso?/rt-link"]
rt-nso = ["dep:nx-rt-nso", "rt"]
service-apm = ["dep:nx-service-apm", "nx-rt-hbapp?/service-apm"]
service-applet = ["dep:nx-service-applet", "nx-rt-hbapp?/service-applet"]
# No `dep:` entry: each library applet's FFI surface lives in `nx-rt-hbapp`, so
# the umbrella only forwards the feature rather than linking the crate itself.
service-applet-album = ["nx-rt-hbapp?/service-applet-album"]
service-applet-err = ["nx-rt-hbapp?/service-applet-err"]
service-applet-friends = ["nx-rt-hbapp?/service-applet-friends"]
service-applet-hid = ["nx-rt-hbapp?/service-applet-hid"]
service-applet-mii = ["nx-rt-hbapp?/service-applet-mii"]
service-applet-nfp = ["nx-rt-hbapp?/service-applet-nfp"]
service-applet-pctlauth = ["nx-rt-hbapp?/service-applet-pctlauth"]
service-applet-psel = ["nx-rt-hbapp?/service-applet-psel"]
service-bsd = ["dep:nx-service-bsd"]
service-fs = ["dep:nx-service-fs", "nx-rt-hbapp?/service-fs"]
service-hid = ["dep:nx-service-hid", "nx-rt-hbapp?/service-hid"]
service-nv = ["dep:nx-service-nv", "nx-rt-hbapp?/service-nv"]
service-set = ["dep:nx-service-set", "nx-rt-hbapp?/service-set"]
service-sfdnsres = ["dep:nx-service-sfdnsres"]
service-sm = ["dep:nx-service-sm"]
service-time = ["dep:nx-service-time", "nx-rt-hbapp?/service-time"]
service-vi = ["dep:nx-service-vi", "nx-rt-hbapp?/service-vi"]
sf = ["dep:nx-sf"]
svc = ["dep:nx-svc"]
sync = ["dep:nx-std-sync", "alloc"]
# Virtual file descriptor table and device registry, replacing libsysbase's
# The process environment, replacing newlib's.
sys-env = ["dep:nx-sys-env", "alloc"]
sys-fd = ["dep:nx-sys-fd", "alloc"]
# Forwards `sys-virtmem` to whichever runtime crate is in the build: its startup
# sequence calls `virtmem`'s Rust API directly when the crate is present, and
# falls back to libnx's `virtmemSetup` by name when it is not.
# Pulls `rand` because `virtmem` draws its ASLR offsets from `rand::rngs::SysRng`, whose entropy
# resolves to the symbol `nx-rand` defines; without the crate in the graph that symbol is undefined
# at link time.
sys-mem = [
    "dep:nx-sys-mem",
    "dep:nx-sys-virtmem",
    "alloc",
    "rand",
    "nx-rt-hbapp?/sys-virtmem",
    "nx-rt-nso?/sys-virtmem",
]
# The socket driver, replacing libnx's socket.c: the "soc" device plus the BSD C API.
# Forwards to `nx-rt-core`, which owns the one entry point whose interface
# revision follows the running firmware.
sys-net = ["dep:nx-sys-net", "sys-fd", "service-bsd", "nx-rt-core?/sys-net"]
sys-sync = ["dep:nx-sys-sync"]
# Forwards `sys-thread` to the runtime crate, on the same terms as `sys-mem`.
sys-thread = ["dep:nx-sys-thread", "nx-rt-hbapp?/sys-thread", "nx-rt-nso?/sys-thread"]
sys-thread-tls = ["dep:nx-sys-thread-tls"]
# Threads in `std::thread` shape: the builder, `spawn`, and a `JoinHandle<T>`
# that yields the closure's value, over the non-generic `nx-sys-thread` layer.
thread = ["dep:nx-svc", "dep:nx-sys-thread", "dep:thiserror", "alloc"]
time = ["dep:nx-time"]
wlaninf = ["dep:nx-wlaninf"]

[dependencies]
nx-alloc = { version = "0.1.0", path = "../nx-alloc", optional = true }
nx-display = { version = "0.1.0", path = "../nx-display", optional = true }
nx-net = { version = "0.1.0", path = "../nx-net", optional = true }
nx-fsdev = { version = "0.1.0", path = "../nx-fsdev", optional = true }
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-pm = { version = "0.1.0", path = "../nx-pm", optional = true }
nx-rand = { version = "0.1.0", path = "../nx-rand", optional = true }
nx-romfs = { version = "0.1.0", path = "../nx-romfs", optional = true }
nx-rt-core = { version = "0.1.0", path = "../nx-rt-core", optional = true }
nx-rt-hbapp = { version = "0.1.0", path = "../nx-rt-hbapp", optional = true }
nx-rt-nso = { version = "0.1.0", path = "../nx-rt-nso", optional = true }
nx-service-apm = { version = "0.1.0", path = "../nx-service-apm", optional = true }
nx-service-applet = { version = "0.1.0", path = "../nx-service-applet", optional = true }
nx-service-fs = { version = "0.1.0", path = "../nx-service-fs", optional = true }
nx-service-hid = { version = "0.1.0", path = "../nx-service-hid", optional = true }
nx-service-nv = { version = "0.1.0", path = "../nx-service-nv", optional = true }
nx-service-set = { version = "0.1.0", path = "../nx-service-set", optional = true }
nx-service-bsd = { version = "0.1.0", path = "../nx-service-bsd", optional = true }
nx-service-sfdnsres = { version = "0.1.0", path = "../nx-service-sfdnsres", optional = true }
nx-service-sm = { version = "0.1.0", path = "../nx-service-sm", optional = true }
nx-service-time = { version = "0.1.0", path = "../nx-service-time", optional = true }
nx-service-vi = { version = "0.1.0", path = "../nx-service-vi", optional = true }
nx-sf = { version = "0.1.0", path = "../nx-sf", optional = true }
nx-std-path = { version = "0.1.0", path = "../nx-std-path", optional = true }
nx-std-sync = { version = "0.1.0", path = "../nx-std-sync", optional = true }
nx-svc = { version = "0.1.0", path = "../nx-svc", optional = true }
nx-sys-args = { version = "0.1.0", path = "../nx-sys-args", optional = true }
nx-sys-env = { version = "0.1.0", path = "../nx-sys-env", optional = true }
nx-sys-fd = { version = "0.1.0", path = "../nx-sys-fd", optional = true }
nx-sys-mem = { version = "0.1.0", path = "../nx-sys-mem", optional = true }
nx-sys-net = { version = "0.1.0", path = "../nx-sys-net", optional = true }
nx-sys-sync = { version = "0.1.0", path = "../nx-sys-sync", optional = true }
nx-sys-thread = { version = "0.1.0", path = "../nx-sys-thread", optional = true }
nx-sys-thread-tls = { version = "0.1.0", path = "../nx-sys-thread-tls", optional = true }
nx-sys-virtmem = { version = "0.1.0", path = "../nx-sys-virtmem", optional = true }
nx-time = { version = "0.1.0", path = "../nx-time", optional = true }
nx-tls = { version = "0.1.0", path = "../nx-tls", optional = true }
nx-wlaninf = { version = "0.1.0", path = "../nx-wlaninf", optional = true }
thiserror = { version = "2.0", default-features = false, optional = true }

# Feature-gated, linked via meson for FFI symbol re-export; not `use`d in Rust source.
[package.metadata.cargo-machete]
ignored = ["nx-service-bsd", "nx-service-fs", "nx-service-nv"]
