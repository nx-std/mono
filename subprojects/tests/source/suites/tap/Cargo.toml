[package]
name = "nx-tests-tap"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_tests_tap"
crate-type = ["rlib", "staticlib"]
test = false
doctest = false
bench = false

[features]
# Enable the __nx_tests_tap FFI
ffi = []

[dependencies]
nx-alloc = { version = "0.1.0", path = "../../../../nx-alloc", features = ["global-allocator"] }
nx-panic-handler = { version = "0.1.0", path = "../../../../nx-panic-handler" }
nx-std-fs = { version = "0.1.0", path = "../../../../nx-std-fs", features = ["extern-state"] }
nx-std-path = { version = "0.1.0", path = "../../../../nx-std-path" }
nx-std-sync = { version = "0.1.0", path = "../../../../nx-std-sync" }
nx-sys-net = { version = "0.1.0", path = "../../../../nx-sys-net", features = ["extern-state"] }
thiserror = { version = "2.0.12", default-features = false }
