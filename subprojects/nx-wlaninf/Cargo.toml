[package]
name = "nx-wlaninf"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_wlaninf"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
# C-FFI surface (`__nx_wlaninf__*` symbols). Required for any libnx
# `wlaninf.h` override.
ffi = [
    "nx-service-wlaninf/ffi",
    "nx-sf/ffi",
    "nx-svc/ffi",
    "nx-std-sync/ffi",
]

# `nx-svc` is a feature-only dependency: the `ffi` feature activates
# `nx-svc/ffi` so the SVC override symbols are linked, but no source line names
# the crate now that the result-code mappings live on the errors themselves.
[package.metadata.cargo-machete]
ignored = ["nx-svc"]

[dependencies]
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-service-sm = { version = "0.1.0", path = "../nx-service-sm" }
nx-service-wlaninf = { version = "0.1.0", path = "../nx-service-wlaninf" }
nx-sf = { version = "0.1.0", path = "../nx-sf" }
nx-std-sync = { version = "0.1.0", path = "../nx-std-sync" }
nx-svc = { version = "0.1.0", path = "../nx-svc" }
thiserror = { version = "2", default-features = false }
