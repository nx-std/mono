[package]
name = "nx-rt-nso"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_rt_nso"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
# Enable the C-FFI surface — the `__nx_rt_nso__*` libnx-override symbols.
# Pulls `nx-rt-core/ffi`: the NSO applet FFI re-uses `nx_rt_core::ffi::common`.
ffi = ["nx-rt-core/ffi"]
# Per-kind `pm`-launch `.crt0` for the opt-in `rustc`-link pipeline. Emits this
# crate's own `_start` (the NSO process-launch startup ABI). Leave it off on
# the GCC pipeline, where `_start` still comes from libnx's `switch_crt0.s`.
rt-link = []
# Main-thread bring-up — gates the Rust arm of the `__libnx_init_thread`
# startup step. With it off that step calls libnx's own, which is the only
# implementation in the link when the matching Meson option is off.
sys-thread = ["nx-rt-core/sys-thread"]
# Virtual-memory reservation map — gates the Rust arm of the `virtmemSetup`
# startup step, on the same terms as `sys-thread`.
sys-virtmem = ["nx-rt-core/sys-virtmem"]

[dependencies]
nx-alloc = { version = "0.1.0", path = "../nx-alloc" }
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-rt-core = { version = "0.1.0", path = "../nx-rt-core", features = ["service-applet"] }
nx-service-applet = { version = "0.1.0", path = "../nx-service-applet" }
nx-svc = { version = "0.1.0", path = "../nx-svc" }

# The build-time Application Manager identity arrives as the `nso_applet_type`
# cfg value, set by the Meson option of the same name. Denying the lint turns a
# `#[cfg(nso_applet_type = ...)]` arm naming a value outside this list into a
# compile error, instead of an arm that silently never compiles.
[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
    'cfg(nso_applet_type, values("application", "library-applet", "none", "overlay-applet", "system-applet", "system-application"))',
] }
