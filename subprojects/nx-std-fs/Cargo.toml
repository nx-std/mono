[package]
name = "nx-std-fs"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_std_fs"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
# Borrow the descriptor layer's process-wide state instead of defining it. Forwarded to
# `nx-sys-fd`; see docs/code/rust-process-wide-state.md.
extern-state = ["nx-sys-fd/extern-state"]

[dependencies]
nx-alloc = { version = "0.1.0", path = "../nx-alloc", features = ["global-allocator"] }
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-std-path = { version = "0.1.0", path = "../nx-std-path" }
nx-sys-fd = { version = "0.1.0", path = "../nx-sys-fd" }
thiserror = { version = "2.0.12", default-features = false }
