[package]
name = "nx-sys-net"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_sys_net"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
# Enable the __nx_sys_net FFI
ffi = []
# Borrow the process-wide session from another static library instead of defining it.
#
# For an application library compiled into its own archive alongside the one that owns the driver.
# Exactly one static library in a program leaves this off; every other one turns it on. Must not be
# combined with `ffi`, whose `#[no_mangle]` entry points would collide. See the crate documentation,
# "Process-wide when the process links this crate twice".
extern-state = []

[dependencies]
nx-alloc = { version = "0.1.0", path = "../nx-alloc", features = ["global-allocator"] }
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-service-bsd = { version = "0.1.0", path = "../nx-service-bsd" }
nx-service-sm = { version = "0.1.0", path = "../nx-service-sm" }
nx-sf = { version = "0.1.0", path = "../nx-sf" }
nx-std-path = { version = "0.1.0", path = "../nx-std-path" }
nx-std-sync = { version = "0.1.0", path = "../nx-std-sync" }
nx-sys-fd = { version = "0.1.0", path = "../nx-sys-fd" }
thiserror = { version = "2.0.12", default-features = false }
zerocopy = "0.8"
