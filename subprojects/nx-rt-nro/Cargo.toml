[package]
name = "nx-rt-nro"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_rt_nro"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
# Master switch for the C-FFI surface (`__nx_rt_nro__*` symbols). Required for any libnx override.
# Pulls `nx-rt-core/ffi`: the NRO FFI re-exports the shared helpers from `nx_rt_core::ffi::common`.
# Pulls `nx-service-applet*?/ffi`: those crates gate their result-code mapping on
# the feature, and only the adapters below this switch call `to_rc`. A consumer
# that enables `service-applet` without this compiles none of the mapping.
ffi = [
    "nx-sf/ffi",
    "nx-rt-core/ffi",
    "nx-service-applet?/ffi",
    "nx-service-applet-album?/ffi",
    "nx-service-applet-err?/ffi",
    "nx-service-applet-friends?/ffi",
    "nx-service-applet-hid?/ffi",
    "nx-service-applet-mii?/ffi",
    "nx-service-applet-nfp?/ffi",
    "nx-service-applet-pctlauth?/ffi",
    "nx-service-applet-psel?/ffi",
]
# Per-kind hbloader `.crt0` for the opt-in `rustc`-link pipeline. Emits this
# crate's own `_start` (the homebrew-loader startup ABI). Leave it off on the
# GCC pipeline, where `_start` still comes from libnx's `switch_crt0.s`.
rt-link = []
# Application Performance Management — gates `services::apm` + `ffi::apm`.
service-apm = ["dep:nx-service-apm"]
# Applet (am) service — gates `services::applet` + `ffi::applet`.
# Pulls `nx-rt-core/service-applet`: the shared applet manager lives in the core.
service-applet = ["dep:nx-service-applet", "nx-rt-core/service-applet"]
# Album library applet — gates `ffi::album`. Pulls `service-applet`: the Album
# is launched through the applet proxy the core holds.
service-applet-album = ["dep:nx-service-applet-album", "service-applet"]
# Error library applet — gates `ffi::applet_err`. Pulls `service-applet`: the
# dialog is launched through the applet proxy the core holds.
service-applet-err = ["dep:nx-service-applet-err", "service-applet"]
# MyPage library applet — gates `ffi::friends`. Pulls `service-applet`: the
# friends menu is launched through the applet proxy the core holds.
service-applet-friends = ["dep:nx-service-applet-friends", "service-applet"]
# Controller library applet — gates `ffi::hid_la`. Pulls `service-applet`: the
# applet is launched through the applet proxy the core holds. Pulls
# `service-hid`: every launch first asks the HID service for the supported npad
# style set and joy hold type, and libnx's own HID session is left zeroed once
# `hidInitialize` is overridden.
service-applet-hid = ["dep:nx-service-applet-hid", "service-applet", "service-hid"]
# Mii editor library applet — gates `ffi::mii`. Pulls `service-applet`: the Mii
# editor is launched through the applet proxy the core holds.
service-applet-mii = ["dep:nx-service-applet-mii", "service-applet"]
# Cabinet library applet — gates `ffi::nfp`. Pulls `service-applet`: the amiibo
# editor is launched through the applet proxy the core holds.
service-applet-nfp = ["dep:nx-service-applet-nfp", "service-applet"]
# Parental Controls auth library applet — gates `ffi::pctlauth`. Pulls
# `service-applet`: the PIN screens are launched through the applet proxy the
# core holds.
service-applet-pctlauth = ["dep:nx-service-applet-pctlauth", "service-applet"]
# Player-select library applet — gates `ffi::psel`. Pulls `service-applet`: the
# user picker is launched through the applet proxy the core holds.
service-applet-psel = ["dep:nx-service-applet-psel", "service-applet"]
# Filesystem (fsp-srv) service — gates `services::fs` + `ffi::fs`.
# Pulls `nx-fsdev`: the session it connects lives there, alongside the filesystem
# device that also addresses objects inside it.
# Pulls `nx-fsdev/ffi`: the startup sequence mounts the SD card through
# `nx_fsdev::mount`, which that crate gates with the C surface it serves.
service-fs = ["dep:nx-service-fs", "dep:nx-fsdev", "nx-fsdev/ffi"]
# Human Input Device service — gates `services::hid` + `ffi::hid`. Pulls `service-applet` (aruid lookup).
service-hid = ["dep:nx-service-hid", "service-applet"]
# NVIDIA driver service — gates `services::nv` + `ffi::nv`. Pulls `service-applet` (aruid lookup).
service-nv = ["dep:nx-service-nv", "service-applet"]
# System Settings (set:sys) service — gates `services::set` + `ffi::setsys`.
service-set = ["dep:nx-service-set"]
# Time service — gates `services::time` + `ffi::time`. Pulls `nx-time`, which owns the
# realtime clock this manager anchors at startup.
service-time = ["dep:nx-service-time", "dep:nx-time"]
# Visual Interface (display/layer) service — gates `services::vi` + `ffi::vi`.
# Pulls `service-applet` (the managed-display-layer fallback in `viCreateLayer`
# and ARUID lookup in `viGetIndirectLayerImageMap` both reach into the applet
# service).
service-vi = ["dep:nx-service-vi", "service-applet"]

[dependencies]
nx-alloc = { version = "0.1.0", path = "../nx-alloc" }
nx-fsdev = { version = "0.1.0", path = "../nx-fsdev", optional = true }
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-rt-core = { version = "0.1.0", path = "../nx-rt-core" }
nx-service-apm = { version = "0.1.0", path = "../nx-service-apm", optional = true }
nx-service-applet = { version = "0.1.0", path = "../nx-service-applet", optional = true }
nx-service-applet-album = { version = "0.1.0", path = "../nx-service-applet-album", optional = true }
nx-service-applet-err = { version = "0.1.0", path = "../nx-service-applet-err", optional = true }
nx-service-applet-friends = { version = "0.1.0", path = "../nx-service-applet-friends", optional = true }
nx-service-applet-hid = { version = "0.1.0", path = "../nx-service-applet-hid", optional = true }
nx-service-applet-mii = { version = "0.1.0", path = "../nx-service-applet-mii", optional = true }
nx-service-applet-nfp = { version = "0.1.0", path = "../nx-service-applet-nfp", optional = true }
nx-service-applet-pctlauth = { version = "0.1.0", path = "../nx-service-applet-pctlauth", optional = true }
nx-service-applet-psel = { version = "0.1.0", path = "../nx-service-applet-psel", optional = true }
nx-service-fs = { version = "0.1.0", path = "../nx-service-fs", optional = true }
nx-service-hid = { version = "0.1.0", path = "../nx-service-hid", optional = true }
nx-service-nv = { version = "0.1.0", path = "../nx-service-nv", optional = true }
nx-service-set = { version = "0.1.0", path = "../nx-service-set", optional = true }
nx-service-sm = { version = "0.1.0", path = "../nx-service-sm" }
nx-service-time = { version = "0.1.0", path = "../nx-service-time", optional = true }
nx-service-vi = { version = "0.1.0", path = "../nx-service-vi", optional = true }
nx-sf = { version = "0.1.0", path = "../nx-sf" }
nx-std-sync = { version = "0.1.0", path = "../nx-std-sync" }
nx-svc = { version = "0.1.0", path = "../nx-svc" }
nx-sys-mem = { version = "0.1.0", path = "../nx-sys-mem" }
nx-sys-thread-tls = { version = "0.1.0", path = "../nx-sys-thread-tls" }
nx-time = { version = "0.1.0", path = "../nx-time", optional = true }
thiserror = { version = "2", default-features = false }
zerocopy = { workspace = true }

# `nx-sys-mem` and `nx-sys-thread-tls` are linked via meson for FFI symbol
# re-export; not `use`d in Rust source.
[package.metadata.cargo-machete]
ignored = ["nx-sys-mem", "nx-sys-thread-tls"]
