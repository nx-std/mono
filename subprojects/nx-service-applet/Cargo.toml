[package]
name = "nx-service-applet"
version = "0.1.0"
edition = "2024"

[lib]
name = "nx_service_applet"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
# Enable the `ToResultCode` mapping the `nx-rt-*` FFI adapters consume. No FFI
# surface lives here; the feature exists so a pure-Rust consumer does not compile
# a mapping only a C boundary needs.
ffi = []

[dependencies]
nx-cpu = { version = "0.1.0", path = "../nx-cpu" }
nx-panic-handler = { version = "0.1.0", path = "../nx-panic-handler" }
nx-service-sm = { version = "0.1.0", path = "../nx-service-sm" }
nx-sf = { version = "0.1.0", path = "../nx-sf" }
nx-sys-thread-tls = { version = "0.1.0", path = "../nx-sys-thread-tls" }
nx-svc = { version = "0.1.0", path = "../nx-svc" }
static_assertions = "1"
thiserror = { version = "2", default-features = false }
zerocopy = { workspace = true }

