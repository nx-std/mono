# This file configures Cargo's behavior for this project.

[build]
# Set the default target platform for `cargo build`.
# This is for the Nintendo Switch, using a freestanding (no-std) environment.
#
# The repo-local spec is used rather than the built-in
# `aarch64-nintendo-switch-freestanding` because two of its properties are not
# expressible anywhere else. `tls-model = "local-exec"` is the one that matters:
# the built-in target reports `dynamic-linking`, so LLVM defaults to the TLSDESC
# model and emits descriptors a dynamic loader is expected to resolve at load
# time. Nothing in this stack resolves them - Horizon has no such loader - so a
# `#[thread_local]` compiled that way links but faults on first access. Local
# exec instead emits TPREL relocations the linker resolves against the layout
# `switch.ld` already defines, which is what `libnx` and `nx-sys-thread` both
# set the thread pointer up for.
#
# Because the spec is a property of the target rather than a flag, it cannot be
# applied to some crates and missed on others. A `RUSTFLAGS` entry could be:
# `subprojects/nx-rt-nso/meson.build` overwrites `RUSTFLAGS` wholesale, which
# would leave that one crate on a different TLS model than everything it links
# against.
#
# See docs/rustc-link-pipeline.md for the spec's other role, and
# `just check-target-json` for the check keeping its link script in sync.
target = ["aarch64-nintendo-horizon.json"]

# Override the default target directory for build artifacts.
# This places all compiled files in `buildDir/cargo-target` instead of the default `target/`.
# NOTE: The justfile passes `--target-dir` explicitly, which overrides this setting.
# This serves as a fallback when cargo is invoked directly (not through just tasks).
target-dir = "buildDir/cargo-target"

# Default build-time Application Manager identity for `nx-rt-nso`.
# The crate has one `APPLET_TYPE` arm per identity and rejects an unset or
# unknown value with a `compile_error!`, so a bare `cargo` invocation needs a
# value to build at all. Meson builds set `RUSTFLAGS` from the `nso_applet_type`
# option, which replaces this default; nothing else reads the cfg.
#
# `getrandom_backend` tells `getrandom` that this target's entropy comes from a
# symbol the platform defines rather than from one of its built-in backends.
# `nx-rand` defines it. Horizon is not a target `getrandom` knows, so dropping
# this cfg does not silently fall back: the crate fails to build, which is the
# outcome to want. It must be repeated by anything that sets `RUSTFLAGS` itself,
# since the environment variable replaces this list wholesale rather than adding
# to it - `subprojects/nx-rt-nso/meson.build` is the one place that does.
rustflags = [
    "--cfg", 'nso_applet_type="application"',
    "--cfg", 'getrandom_backend="custom"',
]

[unstable]
# This section enables unstable Cargo features.

# Passing a `.json` target spec to Cargo is itself unstable, so `[build] target`
# above does not resolve without this.
json-target-spec = true

# The `build-std` feature allows Cargo to recompile parts of the standard library.
# This is necessary for custom targets like `aarch64-nintendo-horizon`
# which don't have a pre-built standard library.
# We are building `core`, `compiler_builtins`, and `alloc`.
# See:
#  - https://doc.rust-lang.org/cargo/reference/unstable.html#build-std
#  - https://doc.rust-lang.org/cargo/reference/unstable.html#build-std-features
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# The `unstable-options` flag is required to use other unstable options,
# like `build-std`. It also allows passing unstable options to rustc.
# See: https://doc.rust-lang.org/cargo/commands/cargo-build.html#output-options
unstable-options = true

# Compilation profiles configuration for Nintendo Switch homebrew.
# These profiles are configured to work optimally with the freestanding
# target and custom panic handler implementation.

[profile.dev]
# Use abort panic strategy for smaller binaries and compatibility with no_std environment.
# This is required for custom panic handlers and the Nintendo Switch homebrew environment.
panic = "abort"

[profile.release]
# Use abort panic strategy for smaller binaries and compatibility with no_std environment.
# This is required for custom panic handlers and the Nintendo Switch homebrew environment.
panic = "abort"
