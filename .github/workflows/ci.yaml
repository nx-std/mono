# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  meson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Submodules stay uninitialized: the meson build definition lives in this
      # repo, and both tasks below only read/interpret those files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # renovate: datasource=pypi depName=meson
      - name: Setup meson
        run: pip install 'meson==1.11.2'

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: fmt-meson-check
        run: just fmt-meson-check

      - name: check-meson
        run: just check-meson
