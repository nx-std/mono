# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  meson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Submodules stay uninitialized: the meson build definition lives in this
      # repo, and both tasks below only read/interpret those files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # renovate: datasource=pypi depName=meson
      - name: Setup meson
        run: pip install 'meson==1.11.2'

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: fmt-meson-check
        run: just fmt-meson-check

      - name: check-meson
        run: just check-meson

  rust:
    # The `ffi` variant enables every crate's `ffi` feature, so the C-facing
    # `__nx_*` surface is compiled too; the default variant covers the pure-Rust
    # build that homebrew crates consume as rlibs.
    name: rust (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            features: ''
          - variant: ffi
            features: '--features ffi'
    steps:
      # Submodules stay uninitialized: every workspace member is pure Rust and
      # the cargo build never reaches into the vendored C sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain (nightly + rustfmt/clippy/rust-src) comes from
      # rust-toolchain.toml; `rust-src` is what lets build-std compile core and
      # alloc for the tier-3 Switch target.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          cache-workspaces: '. -> buildDir/cargo-target'
          rustflags: ''

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: check
        run: just check-rs ${{ matrix.features }}

      - name: clippy
        run: just clippy ${{ matrix.features }} -- -D warnings --force-warn deprecated --force-warn dead-code

  rust-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `just fmt-rs-check` invokes `cargo +nightly fmt`, which resolves the
      # `nightly` channel rather than the pin in rust-toolchain.toml, so rustfmt
      # has to be installed on that channel and not on the pinned one.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
          rustflags: ''

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: fmt-rs-check
        run: just fmt-rs-check
